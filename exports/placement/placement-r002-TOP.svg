<text x="40" y="594">S3 pose: PCB centre (66.0, 21.0) mm, rotation 90 deg, turned over. 9 wires (8 stick wires, 1 UART link), straight XY total 286 mm, longest 63 mm.</text>
<text x="40" y="612">The S3 overlaps the DevKitC in this view on purpose: with both in one layer no pose fits. Layers and heights are not assigned. XY lower bounds only. PROPOSED / NOT FOR ASSEMBLY.</text>
<text x="40" y="630">Blue: S3 PCB 28 x 57 mm (owner readings 2026-11-12), lighter dashed: antenna overhang (centring assumed). Tan: DevKitC V4. Grey dots: gamepad test pads.</text>
<text x="40" y="648">S3 header order is Espressif DevKitC-1 order, assumed for the owner board; 2.54 mm pitch is a hypothesis. Lines: J1L blue, J1R purple, UART link black.</text>
