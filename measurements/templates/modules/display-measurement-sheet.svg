<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Arial, Helvetica, sans-serif">
<title>2.8 in SPI TFT display module (ILI9341, XPT2046 touch) - measurement sheet</title>
<rect width="1100" height="760" fill="#ffffff"/>
<text x="24" y="34" font-size="22" font-weight="bold">2.8 in SPI TFT display module (ILI9341, XPT2046 touch) - what to measure</text>
<text x="24" y="58" font-size="13">View: Front (screen facing you), pin header edge at the BOTTOM.</text>
<text x="24" y="76" font-size="13">Datum: Bottom-left corner of the PCB rectangle in that view. X to the right, Y up. Caliper, millimetres. NOT TO SCALE: the sketch only shows where to measure.</text>
<rect x="40" y="110" width="300" height="520" fill="#e8f1e4" stroke="#222" stroke-width="2"/>
<circle cx="40" cy="630" r="7" fill="#d32f2f"/>
<text x="36" y="654" font-size="13" fill="#d32f2f" font-weight="bold">DATUM (0,0)</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/></marker></defs>
<line x1="40" y1="680" x2="340" y2="680" stroke="#1565c0" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="194.0" y="675.0" font-size="13" fill="#1565c0" font-weight="bold">D-W</text>
<line x1="18" y1="630" x2="18" y2="110" stroke="#1565c0" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="22.0" y="365.0" font-size="13" fill="#1565c0" font-weight="bold">D-L</text>
<rect x="60" y="160" width="260" height="390" fill="#cfd8dc" stroke="#222"/><text x="70" y="180" font-size="12">glass (PANEL)</text>
<rect x="85" y="195" width="210" height="320" fill="#455a64" stroke="#222"/><text x="95" y="215" font-size="12" fill="#fff">visible window (VIEW)</text>
<circle cx="70" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="88" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="106" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="124" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="142" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="160" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="178" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="196" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="214" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="232" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="250" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="268" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="286" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<circle cx="304" cy="612" r="4" fill="#c9a227" stroke="#222"/>
<text x="70" y="596" font-size="12">pin header (HDR)</text>
<circle cx="52" cy="122" r="6" fill="#fff" stroke="#222"/>
<circle cx="328" cy="122" r="6" fill="#fff" stroke="#222"/>
<circle cx="52" cy="570" r="6" fill="#fff" stroke="#222"/>
<circle cx="328" cy="570" r="6" fill="#fff" stroke="#222"/>
<text x="62" y="126" font-size="11">holes, if any</text>
<text x="410" y="102" font-size="14" font-weight="bold">Side view (heights)</text>
<rect x="410" y="170" width="220" height="10" fill="#e8f1e4" stroke="#222"/><text x="640" y="180" font-size="12">PCB = D-T</text>
<rect x="440" y="130" width="60" height="40" fill="#9aa" stroke="#222"/><text x="505" y="152" font-size="12">tallest part above top</text>
<rect x="540" y="180" width="50" height="22" fill="#bbb" stroke="#222"/><text x="595" y="202" font-size="12">part / pin below</text>
<text x="410" y="252" font-size="14" font-weight="bold">Readings (tier 1 first; value goes in module-readings.csv)</text>
<text x="410" y="274" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-W</tspan><tspan> [T1] PCB width (X extent)</tspan></text>
<text x="410" y="289.2" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-L</tspan><tspan> [T1] PCB length (Y extent)</tspan></text>
<text x="410" y="304.4" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-T</tspan><tspan> [T1] PCB thickness</tspan></text>
<text x="410" y="319.59999999999997" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-PANEL-T</tspan><tspan> [T1] Glass and touch layer: thickness above the PCB front surface</tspan></text>
<text x="410" y="334.79999999999995" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-PANEL-X</tspan><tspan> [T1] Glass: datum edge to its left side</tspan></text>
<text x="410" y="349.99999999999994" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-PANEL-Y</tspan><tspan> [T1] Glass: datum bottom edge to its lower side</tspan></text>
<text x="410" y="365.19999999999993" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-PANEL-W</tspan><tspan> [T1] Glass: width (X)</tspan></text>
<text x="410" y="380.3999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-PANEL-L</tspan><tspan> [T1] Glass: length (Y)</tspan></text>
<text x="410" y="395.5999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-VIEW-X</tspan><tspan> [T1] Visible screen window: datum edge to its left side</tspan></text>
<text x="410" y="410.7999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-VIEW-Y</tspan><tspan> [T1] Visible screen window: datum bottom edge to its lower side</tspan></text>
<text x="410" y="425.9999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-VIEW-W</tspan><tspan> [T1] Visible screen window: width (X)</tspan></text>
<text x="410" y="441.1999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-VIEW-L</tspan><tspan> [T1] Visible screen window: length (Y)</tspan></text>
<text x="410" y="456.39999999999986" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-REAR-H</tspan><tspan> [T1] Tallest rear part: height above the PCB rear surface</tspan></text>
<text x="410" y="471.59999999999985" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-X1</tspan><tspan> [T2] Header: X of the first pin centre</tspan></text>
<text x="410" y="486.79999999999984" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-Y</tspan><tspan> [T2] Header: Y of the pin centres</tspan></text>
<text x="410" y="501.99999999999983" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-P</tspan><tspan> [T2] Header pin pitch</tspan></text>
<text x="410" y="517.1999999999998" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-N</tspan><tspan> [T2] Header pin count (a count, not mm)</tspan></text>
<text x="410" y="532.3999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-H</tspan><tspan> [T2] Header body height above the PCB rear surface</tspan></text>
<text x="410" y="547.5999999999999" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HDR-PIN</tspan><tspan> [T2] Header pin length sticking out</tspan></text>
<text x="410" y="562.8" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-SD-X</tspan><tspan> [T3] microSD slot: datum edge to its left side</tspan></text>
<text x="410" y="578.0" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-SD-Y</tspan><tspan> [T3] microSD slot: datum bottom edge to its lower side</tspan></text>
<text x="410" y="593.2" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-SD-W</tspan><tspan> [T3] microSD slot: width (X)</tspan></text>
<text x="410" y="608.4000000000001" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-SD-L</tspan><tspan> [T3] microSD slot: length (Y)</tspan></text>
<text x="410" y="623.6000000000001" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HA-XNEAR</tspan><tspan> [T2] Mounting hole A: datum edge to the hole's near wall</tspan></text>
<text x="410" y="638.8000000000002" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HA-YNEAR</tspan><tspan> [T2] Mounting hole A: datum edge to the hole's near wall</tspan></text>
<text x="410" y="654.0000000000002" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HA-D</tspan><tspan> [T2] Mounting hole A: diameter</tspan></text>
<text x="410" y="669.2000000000003" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HB-XNEAR</tspan><tspan> [T2] Mounting hole B: datum edge to the hole's near wall</tspan></text>
<text x="410" y="684.4000000000003" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HB-YNEAR</tspan><tspan> [T2] Mounting hole B: datum edge to the hole's near wall</tspan></text>
<text x="410" y="699.6000000000004" font-size="11.5"><tspan font-weight="bold" fill="#1565c0">D-HB-D</tspan><tspan> [T2] Mounting hole B: diameter</tspan></text>
</svg>