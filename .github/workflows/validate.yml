name: Validate public source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/check_public_content.py
      - run: python tools/generate_hardware.py --check
      - run: python -m unittest discover -s tests
      - run: g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include tests/cpp/axis_observer_test.cpp -o /tmp/axis-observer-test && /tmp/axis-observer-test
      - run: python -m pip install platformio==6.1.19
      - run: python -m platformio run -d firmware -e bench
      - run: python -m platformio run -d firmware -e bench-axis-test
